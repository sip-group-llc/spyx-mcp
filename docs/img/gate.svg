      <text x="90" y="26" font-size="13" font-weight="800" fill="#e6edf3" text-anchor="middle">5 Páginas</text>
      <text x="90" y="46" fill="#8b98a5" text-anchor="middle">quem anuncia (personas)</text>
    </g>
    <line x1="400" y1="32" x2="440" y2="32" stroke="#8b98a5" stroke-width="1.5" marker-end="url(#a)"/>
    <g transform="translate(440 0)">
      <rect width="180" height="64" rx="10" fill="#14181d" stroke="#30363d"/>
      <text x="90" y="26" font-size="13" font-weight="800" fill="#e6edf3" text-anchor="middle">1 domínio</text>
      <text x="90" y="46" fill="#8b98a5" text-anchor="middle">hostname de destino</text>
    </g>
    <line x1="620" y1="32" x2="660" y2="32" stroke="#8b98a5" stroke-width="1.5" marker-end="url(#a)"/>
    <g transform="translate(660 0)">
      <rect width="200" height="64" rx="10" fill="#14181d" stroke="#d29922"/>
      <text x="100" y="26" font-size="13" font-weight="800" fill="#e3b341" text-anchor="middle">ABRIR A LANDING</text>
      <text x="100" y="46" fill="#8b98a5" text-anchor="middle">o que é o entregável?</text>
    </g>
    <line x1="860" y1="32" x2="900" y2="32" stroke="#3fb950" stroke-width="1.5" marker-end="url(#a)"/>
    <g transform="translate(900 0)">
      <rect width="228" height="64" rx="10" fill="#132118" stroke="#3fb950"/>
