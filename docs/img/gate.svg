      <text x="114" y="46" fill="#8b98a5" text-anchor="middle">infoproduto, quiz, assinatura</text>
    </g>
  </g>

  <!-- ramos de descarte -->
  <g transform="translate(696 196)" font-size="11">
    <line x1="64" y1="-32" x2="64" y2="0" stroke="#e5484d" stroke-width="1.5" marker-end="url(#r)"/>
    <text x="64" y="-8" font-size="10" fill="#ff8a8e" text-anchor="start" dx="8">descartado antes de contar</text>
    <g transform="translate(-620 8)">
      <rect width="1088" height="106" rx="12" fill="#0f1216" stroke="#3a1c1e"/>
      <g fill="#ff8a8e" font-weight="700">
        <text x="18" y="28">APP</text>
        <text x="138" y="28">SaaS / serviço</text>
        <text x="318" y="28">corretora / prop firm</text>
        <text x="518" y="28">vaga / recrutamento</text>
        <text x="718" y="28">físico</text>
        <text x="838" y="28">micronovela</text>
        <text x="978" y="28">doação</text>
      </g>
      <g fill="#8b98a5">
        <text x="18" y="48">play.google, "Apps Ltd"</text>
        <text x="138" y="48">login, plano mensal de ferramenta</text>
        <text x="318" y="48">"conta financiada", "desafio"</text>
        <text x="518" y="48">"Nebenjob", "trabalhe conosco"</text>
        <text x="718" y="48">"frete grátis"</text>
        <text x="838" y="48">w2a. · fb. · novel · reel</text>
        <text x="978" y="48">ONG, marca de 7 anos</text>
      </g>
      <text x="544" y="86" font-size="11" fill="#c9d1d9" text-anchor="middle">a lição que custou: 323 IDs e 11 personas contados antes de abrir a landing — era um app. Persona nova da mesma operação NÃO é oferta nova.</text>
    </g>
