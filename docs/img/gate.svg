      <text x="90" y="46" fill="#8b98a5" text-anchor="middle">IDs ativos distintos</text>
    </g>
    <line x1="180" y1="32" x2="220" y2="32" stroke="#8b98a5" stroke-width="1.5" marker-end="url(#a)"/>
    <g transform="translate(220 0)">
