<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b98a5"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e5484d"/></marker>
  </defs>
  <rect width="1200" height="340" rx="16" fill="#0b0d10"/>
  <text x="36" y="44" font-size="20" font-weight="800" fill="#e6edf3">O GATE · entregável antes da contagem</text>
  <text x="36" y="66" font-size="12" font-weight="700" fill="#8b98a5">anúncio ≠ Página ≠ domínio ≠ oferta · nunca somar as contagens · abrir a landing antes de contar por marca</text>

  <!-- hierarquia -->
  <g transform="translate(36 100)" font-size="11">
    <g>
      <rect width="180" height="64" rx="10" fill="#14181d" stroke="#30363d"/>
